<!DOCTYPE html>
<html>
<head>
  <title>HTML Registration Website</title>
</head>
<body>

<h1>HTML Registration Website</h1>

<!-- Formatting -->
<p><b>Welcome</b> to the <i>Registration Page</i></p>

<!-- Hyperlink -->
<a href="https://www.google.com">Google</a>

<hr>

<!-- Image -->
<img src="https://via.placeholder.com/100">

<hr>

<!-- Table -->
<table border="1">
  <tr>
    <th>Name</th>
    <th>Email</th>
  </tr>
  <tr>
    <td>John</td>
    <td>john@email.com</td>
  </tr>
</table>

<hr>

<!-- List -->
<ul>
  <li>CS</li>
  <li>IT</li>
</ul>

<hr>

<!-- Form -->
<form>
  Name: <input type="text"><br><br>
  Email: <input type="email"><br><br>
  <input type="submit">
</form>

<hr>

<!-- Frame -->
<iframe src="file1_elements_attributes.html" width="300" height="200"></iframe>

<hr>

<!-- Multimedia -->
<audio controls>
  <source src="sample.mp3">
</audio>

<br><br>

<video width="300" controls>
  <source src="sample.mp4">
</video>

</body>
</html>
