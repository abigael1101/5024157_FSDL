<!-- Statistics Component - stats.html -->
<div class="stats-section">
    <h2>Statistics</h2>
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Students</h3>
            <p class="stat-value">{{students.length}}</p>
        </div>
        <div class="stat-card">
            <h3>Average GPA</h3>
            <p class="stat-value">{{getAverageGPA() | number:'1.2-2'}}</p>
        </div>
        <div class="stat-card">
            <h3>Highest GPA</h3>
            <p class="stat-value">{{getHighestGPA() | number:'1.2-2'}}</p>
        </div>
        <div class="stat-card">
            <h3>Lowest GPA</h3>
            <p class="stat-value">{{getLowestGPA() | number:'1.2-2'}}</p>
        </div>
    </div>
</div>
