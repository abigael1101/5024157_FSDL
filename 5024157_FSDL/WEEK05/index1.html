<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Pro Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 id="today">Loading Date...</h1>
            <p>Plan your next adventure</p>
        </header>

        <div class="input-group">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g. Paris)">
            <button id="addBtn">Add Trip</button>
        </div>

        <p id="errorMessage" class="error"></p>

        <div id="tripList" class="grid">
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
